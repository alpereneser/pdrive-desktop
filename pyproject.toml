[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pdrive-desktop"
version = "0.1.3"
description = "Security-first Proton Drive desktop client for Linux"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "PDrive Desktop contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
pdrive-desktop = "pdrive_desktop.bootstrap:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdrive_desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pdrive_desktop"]
