name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify tag matches project version
        run: |
          project_version=$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$project_version"
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: ruff check .
      - run: mypy
      - name: Build reproducible package
        run: |
          ./scripts/build-deb.sh
          package=$(find dist -maxdepth 1 -name '*.deb' -print -quit)
          sha256sum "$package" > dist/SHA256SUMS
          dpkg-deb --info "$package"
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "PDrive Desktop $GITHUB_REF_NAME"

