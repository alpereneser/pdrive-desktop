name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: ruff check .
      - run: mypy
      - name: Build Debian package twice reproducibly
        run: |
          ./scripts/build-deb.sh
          first_hash=$(sha256sum dist/*.deb | cut -d ' ' -f1)
          first_package=$(find dist -maxdepth 1 -name '*.deb' -print -quit)
          dpkg-deb --info "$first_package"
          dpkg-deb --contents "$first_package"
          mv "$first_package" /tmp/pdrive-first.deb
          ./scripts/build-deb.sh
          second_hash=$(sha256sum dist/*.deb | cut -d ' ' -f1)
          test "$first_hash" = "$second_hash"
      - name: Reject common secret patterns
        run: |
          if git grep -nE 'BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY|github_pat_|gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}' -- ':!.github/workflows/ci.yml'; then
            exit 1
          fi
